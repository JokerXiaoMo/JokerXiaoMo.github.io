<!-- 主题在首帧就定好。这段必须同步执行、且排在样式表之前：
     否则选过深色模式的访客，每次打开都会先闪一下浅色底。
     键名与 main.js 的 initTheme() 必须保持一致（tz-theme）。 -->
<script>
(function () { try { var t = localStorage.getItem('tz-theme'); if (t !== 'dark' && t !== 'light') { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } document.documentElement.setAttribute('data-theme', t); } catch (e) { /* 隐私模式下读不了 localStorage，用默认浅色 */ } })();
</script>

</head>
<body>

<noscript>
  <div style="margin:0;padding:14px 18px;background:#FBEAF0;color:#4B1528;font:14px/1.7 system-ui,-apple-system,sans-serif;text-align:center;border-bottom:1px solid #ED93B1">
    本站内容由 JavaScript 渲染。请在浏览器设置里开启 JavaScript，然后刷新页面。
  </div>
</noscript>

<div class="scroll-progress" id="scrollProgress"></div>

<header class="nav" id="siteNav">
  <a class="nav-brand" href="#top" aria-label="桃白簪花自然科技工作室">
    <img class="brand-mark" src="/assets/logo.webp" alt="" width="32" height="32" decoding="async">
    <span class="brand-text" id="brandText">桃白簪花</span>
  </a>
  <nav class="nav-links" id="navLinks"></nav>
  <div class="nav-actions">
    <button class="nav-search" id="searchToggle" type="button" aria-label="搜索">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17 17"/></svg>
    </button>
    <button class="nav-theme" id="themeToggle" type="button" aria-label="切换主题">
      <svg class="ico-moon" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 12.2A7 7 0 0 1 7.8 4a7 7 0 1 0 8.2 8.2Z"/></svg>
      <svg class="ico-sun" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.6 4.6 6 6M14 14l1.4 1.4M15.4 4.6 14 6M6 14l-1.4 1.4"/></svg>
    </button>
    <button class="nav-menu" id="menuToggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="navDrawer">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-drawer" id="navDrawer">
    <nav class="nav-drawer-links" id="navDrawerLinks"></nav>
    <div class="nav-drawer-foot" id="navDrawerFoot"></div>
  </div>
  <div class="nav-search-bar" id="searchBar">
    <input type="search" id="searchInput" placeholder="搜索文章、工具、图片…" aria-label="搜索文章、工具与图片" autocomplete="off">
    <span class="search-hint">回车确认 · ESC 关闭</span>
  </div>
</header>

<main id="top">

  <section class="hero" id="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-inner">

      <div class="hero-copy">
        <p class="hero-eyebrow reveal">TAOBAI · ZANHUA STUDIO</p>
        <h1 class="hero-title">
          <span class="reveal" style="--d:0ms">桃</span><span class="reveal" style="--d:80ms">白</span><span class="reveal" style="--d:160ms">簪</span><span class="reveal" style="--d:240ms">花</span>
        </h1>
        <p class="hero-sub reveal" style="--d:340ms" id="heroSlogan"></p>
        <p class="hero-intro reveal" style="--d:420ms" id="heroIntro"></p>
        <div class="hero-actions reveal" style="--d:500ms">
          <a class="btn btn-primary" href="#articles">读文章</a>
          <a class="btn btn-ghost" href="#gallery">看图片</a>
        </div>
        <nav class="hero-index reveal" style="--d:580ms" id="heroIndex" aria-label="本站目录"></nav>
      </div>

      <!-- 满树桃花：每一朵花代表十年之约里的一个月，时间过去花就少一朵。
           SVG 的树枝与花朵由 main.js 的 PeachTree 模块生成并注入（种子固定，每次打开都一样）。 -->
      <div class="hero-tree reveal" style="--d:660ms">
        <figure class="tree-figure">
          <svg class="peach-tree" id="peachTree" viewBox="0 0 600 470" role="img"
               aria-labelledby="treeTitle treeDesc">
            <title id="treeTitle">一株盛开的桃树</title>
            <desc id="treeDesc">树上的花代表十年之约：十年共 120 个月，最初有 120 朵花，每过一个月落一朵。</desc>
          </svg>
          <figcaption class="tree-pledge" id="treePledge">
            <span class="pledge-head">
              <span class="pledge-title" id="pledgeTitle">十年之约</span>
              <span class="pledge-left" id="pledgeLeft"></span>
            </span>
            <span class="pledge-ticker">
              <span class="pledge-ticker-label">距下一朵花落</span>
              <span class="pledge-count" id="pledgeCount"></span>
            </span>
            <span class="pledge-note" id="pledgeNote"></span>
          </figcaption>
        </figure>
      </div>

    </div>
    <div class="hero-scroll" aria-hidden="true"><span></span>向下</div>
  </section>

  <section class="section" id="articles">
    <div class="section-head head--folio" data-no="01">
      <div class="section-title">
        <h2>桃花笺</h2>
        <p class="section-en">Notes · 写下来的文字</p>
      </div>
      <div class="section-tools">
        <div class="chip-row" id="articleTags"></div>
      </div>
    </div>
    <div class="article-grid" id="articlesList"></div>
    <div class="empty" id="articlesEmpty" hidden>这一栏还空着。</div>
  </section>

  <section class="section section-alt" id="shares">
    <div class="section-head head--stacked" data-no="02">
      <div class="section-title">
        <h2>拾遗录</h2>
        <p class="section-en">Tools · 顺手做、也顺手收的工具</p>
      </div>
      <div class="section-tools">
        <div class="seg" id="shareFilter">
          <button class="seg-btn is-active" data-cat="all" type="button">全部</button>
          <button class="seg-btn" data-cat="software" type="button">软件</button>
          <button class="seg-btn" data-cat="website" type="button">网站</button>
        </div>
      </div>
    </div>
    <div class="share-grid" id="sharesList"></div>
    <div class="empty" id="sharesEmpty" hidden>还没有收录任何条目。</div>
  </section>

  <section class="section" id="gallery">
    <div class="section-head head--bleed" data-no="03">
      <div class="section-title">
        <h2>观照集</h2>
        <p class="section-en">Gallery · 一组图，加了口令</p>
      </div>
      <div class="section-tools">
        <div class="chip-row" id="galleryTags"></div>
      </div>
    </div>
    <div class="vault-bar" id="vaultBar" hidden>
      <span class="vault-bar-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></svg>
      </span>
      <div class="vault-bar-text">
        <strong id="vaultBarTitle">加密栏板</strong>
        <span id="vaultBarDesc"></span>
      </div>
    </div>
    <div class="masonry" id="galleryGrid"></div>
    <div class="empty" id="galleryEmpty" hidden>图集还是空的。</div>
  </section>

  <section class="section section-alt" id="about">
    <div class="about-wrap" data-no="04">
      <div class="section-title">
        <h2>关于</h2>
        <p class="section-en">About · 关于本站</p>
      </div>
      <div class="about-body" id="aboutBody"></div>
      <div class="about-meta" id="aboutMeta"></div>
      <div class="about-contact">
        <h3>留一句话</h3>
        <p class="muted">不用注册，写下想说的就行。</p>
        <form class="contact-form" id="contactForm">
          <input type="text" name="name" placeholder="称呼" maxlength="60" required>
          <input type="text" name="contact" placeholder="联系方式（可不填）" maxlength="120">
          <textarea name="content" rows="4" placeholder="想说的话…" maxlength="1000" required></textarea>
          <div class="form-foot">
            <button class="btn btn-primary" type="submit">寄出</button>
            <span class="form-msg" id="contactMsg"></span>
          </div>
        </form>
        <!-- 纯静态托管没有后端时，表单提交了也没人收。与其放一个假按钮，
             不如直接把邮箱摆出来（main.js 会按 messageEndpoint 是否配置来二选一显示）。 -->
        <p class="contact-mail" id="contactMail" hidden></p>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="footer-inner">
    <p id="footerText">桃白簪花自然科技工作室</p>
    <div class="footer-social" id="footerSocial"></div>
  </div>
</footer>

<div class="reader" id="reader" hidden>
  <div class="reader-backdrop" data-close></div>
  <article class="reader-panel" role="dialog" aria-modal="true">
    <button class="reader-close" data-close type="button" aria-label="关闭">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l10 10M15 5 5 15"/></svg>
    </button>
    <div class="reader-progress" id="readerProgress"></div>
    <div class="reader-scroll" id="readerScroll">
      <header class="reader-head">
        <div class="reader-tags" id="readerTags"></div>
        <h1 id="readerTitle"></h1>
        <div class="reader-meta" id="readerMeta"></div>
      </header>
      <div class="prose" id="readerBody"></div>
      <div class="reader-foot" id="readerFoot"></div>
    </div>
  </article>
</div>

<div class="detail" id="shareDetail" hidden>
  <div class="detail-backdrop" data-sd-close></div>
  <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="sdTitle" tabindex="-1">
    <button class="detail-close" data-sd-close type="button" aria-label="关闭">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l10 10M15 5 5 15"/></svg>
    </button>
    <div class="detail-scroll" id="sdScroll">
      <div class="detail-head">
        <div class="share-icon" id="sdIcon"></div>
        <div class="detail-head-text">
          <h2 id="sdTitle"></h2>
          <div class="detail-sub" id="sdSub"></div>
        </div>
      </div>
      <div class="detail-tags" id="sdTags"></div>
      <div class="detail-desc prose" id="sdDesc"></div>
      <div class="detail-plats" id="sdPlats"></div>
    </div>
    <div class="detail-actions" id="sdActions"></div>
  </div>
</div>

<div class="gate" id="vaultGate" hidden>
  <div class="gate-backdrop" data-vg-close></div>
  <form class="gate-panel" id="vgForm" role="dialog" aria-modal="true" aria-labelledby="vgTitle" tabindex="-1">
    <div class="gate-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></svg>
    </div>
    <h2 id="vgTitle">加密内容</h2>
    <p class="gate-reason" id="vgReason"></p>
    <div class="gate-input-row">
      <input type="password" id="vgInput" placeholder="输入口令" autocomplete="off" spellcheck="false"
             autocapitalize="off" autocorrect="off" enterkeyhint="go" aria-label="加密口令">
      <button class="gate-eye" id="vgEye" type="button" aria-pressed="false" title="显示或隐藏口令">显示</button>
    </div>
    <div class="gate-foot">
      <button class="btn btn-primary" id="vgSubmit" type="submit">解锁</button>
      <span class="gate-msg" id="vgMsg"></span>
    </div>
  </form>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片查看">
  <div class="lightbox-backdrop" data-lb-close></div>
  <button class="lb-btn lb-prev" data-lb-prev type="button" aria-label="上一张">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="lb-btn lb-next" data-lb-next type="button" aria-label="下一张">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button class="lb-btn lb-close" data-lb-close type="button" aria-label="关闭">
    <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5l10 10M15 5 5 15"/></svg>
  </button>
  <figure class="lb-figure">
    <img id="lbImage" alt="">
    <figcaption>
      <strong id="lbTitle"></strong>
      <span id="lbDesc"></span>
      <em id="lbCount"></em>
    </figcaption>
  </figure>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
