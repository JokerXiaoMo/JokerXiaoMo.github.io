# Cloudflare Worker 部署配置
#
# 在 counts/ 目录下：
#   npx wrangler kv namespace create COUNTS     ← 把返回的 id 填到下面
#   npx wrangler deploy
#
# 部署完你会拿到 https://taobai-counts.<你的子域名>.workers.dev，
# 把它填进站点 /data/stats.json 的 endpoint。

name = "taobai-counts"
main = "worker.js"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "COUNTS"
id = "把 wrangler kv namespace create 返回的 id 填在这里"
